<!DOCTYPE html>
<html lang="en">

<head>

    {% block style %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockSense AI | Broker Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/styles/main.css">
    {% endblock %}
</head>
<body>
    
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <img src="assets/images/logo.png" alt="Logo" id="logo">
                <h3>StockSense AI</h3>
            </div>
            <nav class="sidebar-nav">
                <a href="/" class="active" id="dashboard-link">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/top_movers" id="movers-link">
                    <i class="fas fa-bolt"></i>
                    <span>Top Movers</span>
                </a>
                <a href="/news" id="news-link">
                    <i class="fas fa-newspaper"></i>
                    <span>News Impact</span>
                </a>
                <a href="/ai_assistant" id="assistant-link">
                    <i class="fas fa-robot"></i>
                    <span>AI Assistant</span>
                </a>
            </nav>
        </div>
        {% block content %}
        <!-- Main Content -->
        <div class="main-content">
            <!-- Dashboard Section -->
            <div id="dashboard-section">
                <h2><i class="fas fa-chart-line"></i> Market Dashboard</h2>
                
                <!-- Market Overview -->
                <div id="chartContainer">
                    <canvas id="stockChart"></canvas>
                </div>
            
                <!-- Load Chart.js from CDN -->
                <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
                <script>
                    // Fetch data from the API
                    fetch('/api/market-data')
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('Network response was not ok');
                            }
                            return response.json();
                        })
                        .then(data => {
                            if (data.error) {
                                alert(data.error);
                                return;
                            }
            
                            // Create the chart
                            const ctx = document.getElementById('stockChart').getContext('2d');
                            new Chart(ctx, {
                                type: 'line',
                                data: {
                                    labels: data.labels,
                                    datasets: [{
                                        label: 'AAPL Closing Price ($)',
                                        data: data.prices,
                                        borderColor: 'blue',
                                        fill: false,
                                        tension: 0.1
                                    }]
                                },
                                options: {
                                    responsive: true,
                                    scales: {
                                        x: {
                                            title: {
                                                display: true,
                                                text: 'Time (HH:MM)'
                                            }
                                        },
                                        y: {
                                            title: {
                                                display: true,
                                                text: 'Price (USD)'
                                            }
                                        }
                                    }
                                }
                            });
                        })
                        .catch(error => {
                            console.error('Error fetching data:', error);
                            alert('Failed to load stock data. Please try again later.');
                        });
                </script>
                
                <!-- Top Movers -->
                <div class="card">
                    <div class="card-header">
                        <h3>Top Movers (Last 5 Minutes)</h3>
                    </div>
                    
                    <div class="stock-card" id="aapl-card">
                        <img src="https://logo.clearbit.com/apple.com" alt="AAPL">
                        <div style="flex:1">
                            <h4>AAPL <span class="up">+2.45%</span></h4>
                            <p>Apple Inc.</p>
                        </div>
                        <button class="analyze-btn" data-stock="AAPL">Analyze</button>
                    </div>
                    
                    <div class="stock-card" id="nvda-card">
                        <img src="https://logo.clearbit.com/nvidia.com" alt="NVDA">
                        <div style="flex:1">
                            <h4>NVDA <span class="up">+3.21%</span></h4>
                            <p>NVIDIA Corp.</p>
                        </div>
                        <button class="analyze-btn" data-stock="NVDA">Analyze</button>
                    </div>
                    
                    <div class="stock-card" id="tsla-card">
                        <img src="https://logo.clearbit.com/tesla.com" alt="TSLA">
                        <div style="flex:1">
                            <h4>TSLA <span class="down">-1.23%</span></h4>
                            <p>Tesla Inc.</p>
                        </div>
                        <button class="analyze-btn" data-stock="TSLA">Analyze</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="static/scripts/chart.js"></script>
    <script src="static/scripts/main.js"></script>

    {% endblock %}
</body>
</html>
