{% extends "index.html" %}
{% block style %}
{{ super() }}
<link rel="stylesheet" href="/static/styles/main.css">
<link rel="stylesheet" href="/static/styles/ai-assistant.css">
<style>
    /* Loading indicator styles */
    .loading-indicator {
        display: flex;
        justify-content: center;
        padding: 10px;
    }
    .loading-indicator .dot {
        width: 8px;
        height: 8px;
        margin: 0 4px;
        background-color: rgb(29, 29, 93);
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out both;
    }
    .loading-indicator .dot:nth-child(1) {
        animation-delay: -0.32s;
    }
    .loading-indicator .dot:nth-child(2) {
        animation-delay: -0.16s;
    }
    @keyframes bounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
    }
    
    /* Chat message styles */
    .chat-message {
        margin-bottom: 15px;
        padding: 12px 15px;
        border-radius: 18px;
        max-width: 80%;
        word-wrap: break-word;
    }
    .user-message {
        background-color: #2b3366;
        color: white;
        margin-left: auto;
    }
    .ai-message {
        background-color: #f1f1f1;
        color: #333;
        margin-right: auto;
    }
    
    /* Action button styles */
    .action-buttons {
        margin-top: 10px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }
    .action-btn {
        padding: 5px 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9em;
    }
    .chart-btn {
        background-color: #2196F3;
        color: white;
    }
    .news-btn {
        background-color: #FF9800;
        color: white;
    }
    
    /* Input area styles */
    #chat-input {
        flex: 1;
        padding: 12px 15px;
        border-radius: 20px;
        border: 1px solid #ddd;
        font-size: 1em;
    }
    #send-btn {
        margin-left: 10px;
        padding: 0 20px;
        background-color: #333578;
        color: white;
        border: none;
        border-radius: 20px;
        cursor: pointer;
    }
</style>
{% endblock %}

{% block content %}
<div class="main-content">
    <h2><i class="fas fa-robot"></i> AI Assistant</h2>
    
    <div class="card ai-chat">
        <div class="card-header">
            <h3>Stock Analysis Assistant</h3>
            <div class="assistant-controls">
                <button id="voice-btn" class="voice-control">
                    <i class="fas fa-microphone"></i>
                    <span class="pulse-animation"></span>
                </button>
                <button id="clear-chat" class="text-control">
                    <i class="fas fa-trash-alt"></i> Clear
                </button>
            </div>
        </div>
        
        <div style="display:flex; margin-top:20px;">
            <img src="/static/images/ai-avatar.png" alt="AI" style="width:50px; height:50px; border-radius:50%; margin-right:15px;">
            
            <div style="flex:1">
                <div class="chat-container" id="chat-messages">
                    <div class="chat-message ai-message">
                        <p>Hello! I'm your AI stock assistant. How can I help you today?</p>
                    </div>
                </div>
                
                <form id="chat-form" style="display:flex; margin-top:15px;">
                    <input type="text" id="chat-input" name="query" placeholder="Ask about any stock..." autocomplete="off">
                    <button id="send-btn" type="submit">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
                
                <div id="voice-status" style="display: none; margin-top:10px; color:#666;">
                    <i class="fas fa-microphone"></i> Listening...
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/static/scripts/ai-assistant.js"></script>
{% endblock %}
