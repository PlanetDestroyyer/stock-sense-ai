{% extends "index.html" %}
{% block style %}
{{ super() }}
<link rel="stylesheet" href="/static/styles/main.css">
<link rel="stylesheet" href="/static/styles/ai-assistant.css">
<style>
    /* AI Assistant Specific Styles */
    .ai-chat {
        background: var(--secondary-bg);
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .chat-container {
        max-height: 500px;
        overflow-y: auto;
        padding: 10px;
        background: var(--primary-bg);
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .chat-message {
        margin-bottom: 15px;
        padding: 12px 15px;
        border-radius: 18px;
        max-width: 80%;
        word-wrap: break-word;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .user-message {
        background-color: #2b3366;
        color: white;
        margin-left: auto;
    }

    .ai-message {
        background-color: var(--secondary-bg);
        color: var(--text-primary);
        margin-right: auto;
    }

    #chat-form {
        display: flex;
        margin-top: 20px;
        background: var(--secondary-bg);
        border-radius: 30px;
        padding: 5px;
        align-items: center;
    }

    #chat-input {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text-primary);
        padding: 10px 15px;
        font-size: 1em;
    }

    #chat-input::placeholder {
        color: var(--text-secondary);
    }

    #send-btn {
        background: var(--accent-color);
        color: white;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    #send-btn:hover {
        background: #2563eb;
        transform: scale(1.05);
    }

    .assistant-controls {
        display: flex;
        gap: 10px;
    }

    .voice-control {
        background: var(--accent-color);
        color: white;
        border: none;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        position: relative;
        transition: all 0.3s ease;
    }

    .voice-control:hover {
        transform: scale(1.05);
    }

    .voice-control.active {
        background: var(--danger-color);
    }

    .pulse-animation {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: rgba(59, 130, 246, 0.5);
        animation: pulse 2s infinite;
        opacity: 0;
    }

    .voice-control.active .pulse-animation {
        opacity: 1;
    }

    @keyframes pulse {
        0% {
            transform: scale(1);
            opacity: 1;
        }
        100% {
            transform: scale(1.5);
            opacity: 0;
        }
    }

    .text-control {
        background: var(--secondary-bg);
        color: var(--text-primary);
        border: 1px solid var(--text-secondary);
        border-radius: 20px;
        padding: 8px 15px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .text-control:hover {
        background: rgba(255,255,255,0.1);
    }

    /* Loading indicator styles */
    .loading-container {
        padding: 15px;
        border-radius: 18px;
        background: var(--secondary-bg);
        color: var(--text-primary);
        margin-right: auto;
        max-width: 80%;
    }

    .analyzing-text {
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .loading-dots {
        display: flex;
        gap: 5px;
    }

    .dot {
        width: 8px;
        height: 8px;
        background: var(--text-primary);
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) {
        animation-delay: -0.32s;
    }

    .dot:nth-child(2) {
        animation-delay: -0.16s;
    }

    @keyframes bounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
    }

    /* Action button styles */
    .action-buttons {
        margin-top: 10px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .action-btn {
        padding: 8px 12px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.9em;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .action-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .chart-btn {
        background-color: var(--accent-color);
        color: white;
    }

    .news-btn {
        background-color: var(--warning-color);
        color: white;
    }

    /* Voice status indicator */
    #voice-status {
        display: none;
        margin-top: 10px;
        color: var(--text-secondary);
        font-size: 0.9em;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        .chat-container {
            max-height: 300px;
        }
        
        .assistant-controls {
            flex-direction: column;
            align-items: flex-start;
        }
        
        .chat-message {
            max-width: 90%;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="main-content">
    <h2><i class="fas fa-robot"></i> AI Assistant</h2>
    
    <div class="card ai-chat">
        <div class="card-header">
            <h3>Stock Analysis Assistant</h3>
            <div class="assistant-controls">
                <button id="voice-btn" class="voice-control">
                    <i class="fas fa-microphone"></i>
                    <span class="pulse-animation"></span>
                </button>
                <button id="clear-chat" class="text-control">
                    <i class="fas fa-trash-alt"></i> Clear
                </button>
            </div>
        </div>
        
        <div style="display:flex; margin-top:20px;">
            <img src="static/assets/image/bot-image.jpg" alt="AI" style="width:50px; height:50px; border-radius:50%; margin-right:15px;">
            
            <div style="flex:1">
                <div class="chat-container" id="chat-messages">
                    <div class="chat-message ai-message">
                        <p>Hello! I'm your AI stock assistant. How can I help you today?</p>
                    </div>
                </div>
                
                <form id="chat-form" style="display:flex; margin-top:15px;">
                    <input type="text" id="chat-input" name="query" placeholder="Ask about any stock..." autocomplete="off">
                    <button id="send-btn" type="submit">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
                
                <div id="voice-status" style="display: none; margin-top:10px; color:#666;">
                    <i class="fas fa-microphone"></i> Listening...
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/static/scripts/ai-assistant.js"></script>
{% endblock %}
